name: Vendite
options:
  developmentLanguage: it
  deploymentTarget:
    iOS: "17.0"
targets:
  Vendite:
    type: application
    platform: iOS
    sources: [Vendite]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuonome.vendite
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vendite
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Serve per fotografare gli articoli"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  VenditeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VenditeTests]
    dependencies:
      - target: Vendite
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tuonome.vendite.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Vendite.app/Vendite"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "5.0"
  VenditeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [VenditeUITests]
    dependencies:
      - target: Vendite
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tuonome.vendite.uitests
        TEST_TARGET_NAME: Vendite
        SWIFT_VERSION: "5.0"
schemes:
  Vendite:
    build:
      targets:
        Vendite: all
        VenditeTests: [test]
        VenditeUITests: [test]
    test:
      targets: [VenditeTests, VenditeUITests]
